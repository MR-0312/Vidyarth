# Render deployment configuration
# https://render.com/docs/yaml-spec
#
# This file defines two services:
#   1. vidyarth-backend  — Node.js/Express API (Web Service)
#   2. vidyarth-frontend — React/Vite SPA     (Static Site)
#
# Required environment variables (set in the Render dashboard):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET, CORS_ORIGIN

services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: vidyarth-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # Set the following secrets in the Render dashboard → Environment
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: vidyarth-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the frontend at the deployed backend URL:
      # e.g. https://vidyarth-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback — serve index.html for all client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    autoDeploy: true
